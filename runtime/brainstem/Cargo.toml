[package]
name = "doso-brainstem"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Unified single-process Rust Brainstem runtime (:5052 doso.v1 + :5054 hot-deploy + optional :13145 compat + SHM + AskMe)"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
brainstem-dds-bridge = { path = "../../bridges/brainstem-dds-bridge" }
clap = { version = "4", features = ["derive", "env"] }
doso-brain = { path = "../brain" }
doso-core = { path = "../core" }
doso-hal = { path = "../hal" }
doso-policy = { path = "../policy" }
doso-safety = { path = "../safety" }
doso-sdk = { path = "../.." }
doso-shm-ipc = { path = "../../bridges/doso-shm-ipc" }
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
