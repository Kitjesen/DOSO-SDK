syntax = "proto3";
package doso.v1;

import "common.proto";
import public "messages/navigation.proto";

service Navigation {
  rpc Go(Goal) returns (Receipt);
  rpc GoWithOptions(Goal) returns (Receipt);
  rpc PreviewPlan(PlanQuery) returns (PlanPreview);
  rpc SetSpeedLimit(TaskSpeedLimit) returns (Receipt);
  rpc Status(Empty) returns (Snapshot);
  rpc Path(Empty) returns (Snapshot);
  rpc Route(Empty) returns (NavigationPath);
  rpc WatchPath(Empty) returns (stream NavigationPath);
  rpc Task(TaskQuery) returns (.doso.v1.Task);
  rpc Cancel(CancelTask) returns (Receipt);
  rpc Pause(TaskControl) returns (Receipt);
  rpc Resume(TaskControl) returns (Receipt);
  rpc Watch(TaskQuery) returns (stream .doso.v1.Task);
}
