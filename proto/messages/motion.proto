syntax = "proto3";
package doso.v1;

import "common.proto";
import "observations.proto";
import public "messages/system.proto";

message WatchStateRequest {
  uint32 frequency_hz = 1;
}

enum BodyKind {
  BODY_KIND_ZERO = 0;
  BODY_KIND_GROUNDED = 1;
  BODY_KIND_STANDING = 2;
  BODY_KIND_WALKING = 3;
  BODY_KIND_TRANSITIONING = 4;
  BODY_KIND_DAMPING = 5;
}

enum BodyTransition {
  BODY_TRANSITION_NONE = 0;
  BODY_TRANSITION_STAND_UP = 1;
  BODY_TRANSITION_SIT_DOWN = 2;
  BODY_TRANSITION_GESTURE = 3;
}

message BodyState {
  BodyKind kind = 1;
  BodyTransition transition = 2;
  string gesture_name = 3;
}

enum BodyControlOwner {
  BODY_CONTROL_OWNER_NONE = 0;
  BODY_CONTROL_OWNER_GRPC = 1;
  BODY_CONTROL_OWNER_YUNZHUO = 2;
}

// Read-only status from Brainstem. Source GRPC ownership and lease activity do
// not establish that the external DOSO SDK caller owns control.
message BodyControlStatus {
  BodyState body = 1;
  bool motor_output_enabled = 2;
  BodyControlOwner source_owner = 3;
  bool critical_motor_fault = 4;
  bool grpc_lease_active = 5;
  uint32 lease_remaining_ms = 6;
  uint64 last_accepted_sequence = 7;
  int32 source_last_decision = 8;  // Brainstem CommandRejectReason numeric value.
  bool source_ready_for_walk = 9;
  string source_owner_id = 10;
  uint64 accepted_count = 11;
  uint64 rejected_count = 12;
}

message ProfileInfo {
  string current = 1;
  repeated string available = 2;
  repeated string descriptions = 3;
  string current_description = 4;
}

message SwitchProfileRequest {
  Command command = 1;
  string name = 2;
}

message VelocitySample {
  Vector3 linear_m_s = 1;
  Vector3 angular_rad_s = 2;
  string frame_id = 3;
  SampleTime time = 4;
  // Gateway receipt age; this does not measure sensor capture latency.
  optional double received_age_ms = 5;
  optional bool fresh = 6;
  string source = 7;  // "localization" for the configured localization odometry input.
}

// Position and orientation describe child_frame in parent_frame. The quaternion
// rotates child-frame vectors into parent_frame; velocities are in child_frame.
message OdometrySample {
  Vector3 position_m = 1;
  Quaternion orientation = 2;
  Vector3 linear_velocity_m_s = 3;
  Vector3 angular_velocity_rad_s = 4;
  string parent_frame = 5;
  string child_frame = 6;
  SampleTime time = 7;
  optional double received_age_ms = 8;
  optional bool fresh = 9;
  string source = 10;
}

// Metres/second in robot body XY and radians/second about body Z.
message TeleopVelocity {
  double vx_m_s = 1;
  double vy_m_s = 2;
  double yaw_rad_s = 3;
  bool deadman = 4;
  bool manual_mode = 5;
}

message TeleopRequest {
  Command command = 1;
  // Capture a robot-issued window when producing the sample; never retag queued input.
  uint64 input_window = 2;
  oneof action {
    Empty input = 3;
    TeleopVelocity velocity = 4;
    Empty hold = 5;
    Empty close = 6;
    // Explicit claim or re-claim on this same session, with the native lease TTL.
    Empty claim = 8;
  }
  // Strictly increasing within the stream, including input/hold/close requests.
  uint64 sequence = 7;
}

message TeleopReply {
  string request_id = 1;
  bool accepted = 2;
  string reason = 3;
  uint64 input_window = 4;
  // Velocity acceptance means queued at Gateway, before native execution.
  bool ingress_accepted = 5;
  // Hold/release evidence from the existing native final-output barrier.
  bool final_output_confirmed = 6;
  // Echo the request sequence. Zero with an empty request_id is a window update.
  uint64 sequence = 7;
  ControlState control = 8;
}

message GestureInfo {
  string name = 1;
  string description = 2;
  int32 duration_ms = 3;
}

message GestureList {
  repeated GestureInfo gestures = 1;
}

message PlayGestureRequest {
  Command command = 1;
  string name = 2;
}

message ClearMotorFaultRequest {
  Command command = 1;
  repeated uint32 joint_ids = 2;
}
