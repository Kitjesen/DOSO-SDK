[package]
name = "doso-sdk-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "doso_sdk_ffi"
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-mock = ["dep:tonic", "dep:tokio-stream"]

[dependencies]
doso-sdk = { path = ".." }
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }

[dev-dependencies]
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
