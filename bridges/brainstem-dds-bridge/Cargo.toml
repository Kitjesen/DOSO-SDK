[package]
name = "brainstem-dds-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
doso-sdk = { path = "../../doso-sdk" }
doso-shm-ipc = { path = "../doso-shm-ipc" }
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
cc = "1"
