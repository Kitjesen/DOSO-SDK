name: DOSO Rust SDK

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ONNX Runtime C-API
        run: |
          python -m pip install --quiet onnxruntime
          python -c "import os, pathlib, sys, onnxruntime; capi = pathlib.Path(onnxruntime.__file__).resolve().parent / 'capi'; lib = (capi / 'onnxruntime.dll') if sys.platform == 'win32' else sorted(capi.glob('libonnxruntime.so*'))[0]; assert lib.is_file(), f'missing ORT lib in {capi}'; print('ORT:', onnxruntime.__version__, lib); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'ONNXRUNTIME_DLL_PATH={lib}\n')"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust SDK
        run: cargo test --workspace --locked

      - name: Test example arguments and measurements
        run: cargo test --workspace --examples --locked

      - name: Test Android Rust bridge on host
        run: cargo test --manifest-path android/Cargo.toml --locked

      - name: Test POSIX/Win32 SHM IPC crate
        run: |
          cargo clippy --manifest-path bridges/doso-shm-ipc/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path bridges/doso-shm-ipc/Cargo.toml

      - name: Test Board-A Base Gateway & DDS bridge
        run: |
          cargo clippy --manifest-path bridges/brainstem-dds-bridge/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path bridges/brainstem-dds-bridge/Cargo.toml -- --test-threads=1

      - name: Test ONNX RL runner (including direct SHM loop)
        run: |
          cargo clippy --manifest-path rl/doso-rl-runner/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rl/doso-rl-runner/Cargo.toml -- --test-threads=1

      - name: Build C/Python FFI shared library
        run: cargo build --manifest-path ffi/Cargo.toml

      - name: Test Rust Brainstem runtime (all crates + 4-model ONNX Golden + Hot-Deploy E2E)
        run: |
          cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/Cargo.toml

      - name: Verify crate package
        run: cargo package -p doso-sdk --allow-dirty --locked
