name: DOSO Rust SDK

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy across workspace
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p doso-sdk-ffi --all-targets --features test-mock --locked -- -D warnings

      - name: Test Rust SDK and examples
        run: |
          cargo test -p doso-sdk --locked
          cargo test -p doso-sdk --examples --locked

      - name: Test Android bridge and POSIX/Win32 SHM IPC
        run: |
          cargo test -p doso-sdk-android --locked
          cargo test -p doso-shm-ipc --locked

      - name: Test Board-A Base Gateway, DDS bridge, and ONNX RL runner
        run: |
          cargo test -p brainstem-dds-bridge --locked -- --test-threads=1
          cargo test -p doso-rl-runner --locked -- --test-threads=1

      - name: Build & test C/Python FFI shared library
        run: |
          cargo build -p doso-sdk-ffi --locked
          cargo test -p doso-sdk-ffi --features test-mock --locked

      - name: Test Python SDK against FFI mock server
        run: |
          cargo build -p doso-sdk-ffi --features test-mock --locked
          python -c "import os, pathlib, subprocess, sys; lib = (pathlib.Path('target/debug') / ('doso_sdk_ffi.dll' if sys.platform == 'win32' else 'libdoso_sdk_ffi.so')).resolve(); env = {**os.environ, 'DOSO_SDK_FFI_PATH': str(lib)}; subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'bindings/python/tests'], env=env, check=True)"
